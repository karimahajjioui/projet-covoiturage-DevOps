apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookings-db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookings-db
  template:
    metadata:
      labels:
        app: bookings-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: app

            - name: POSTGRES_DB
              value: bookings
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookings-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bookings-db
spec:
  selector:
    app: bookings-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings-service
spec:

  replicas: 1
  selector:
    matchLabels:
      app: bookings-service
  template:
    metadata:
      labels:
        app: bookings-service
    spec:
      containers:
        - name: bookings-service
          image: hajjiouikarima/covoiturage-bookings-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: '3003'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://app:$(DB_PASSWORD)@bookings-db:5432/bookings
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: TRIPS_SERVICE_URL
              value: http://trips-service:3002
          readinessProbe:
            httpGet:

              path: /health
              port: 3003
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: bookings-service
  labels:
    app: bookings-service
spec:
  selector:
    app: bookings-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003