apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hajjiouikarima/covoiturage-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: USERS_SERVICE_URL
              value: http://users-service:3001
            - name: TRIPS_SERVICE_URL
              value: http://trips-service:3002
            - name: BOOKINGS_SERVICE_URL
              value: http://bookings-service:3003
            - name: NOTIFICATIONS_SERVICE_URL
              value: http://notifications-service:3004
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080